[package]
name = "autocredit-installer"
version = "1.2.1"
description = "AutoCredit installer bootstrapper"
authors = ["XiChen"]
edition = "2021"

[lib]
name = "autocredit_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
